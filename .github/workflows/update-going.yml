name: Update going

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest going
        run: python fetch_going.py

      - name: Commit and push if the going changed
        run: |
          git config user.name "going-bot"
          git config user.email "going-bot@users.noreply.github.com"
          git add going.json going_data.js
          if git diff --cached --quiet; then
            echo "No change in going; nothing to commit."
          else
            git commit -m "Update going"
            git push
          fi
